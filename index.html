    function get_canvas_size() {
        // aspect = width  / height    
        // width  = aspect * height 
        // height = width  / aspect
        let device_info = get_device_info()
        let device_window_aspect = device_info.width/device_info.height
        let w, h;

        let tipping_point_window_aspect = 650/600
        if ( device_window_aspect > tipping_point_window_aspect) { // if wide screen
            h = 0.6 * device_info.height
            w = h * ideal_canvas_aspect

        } else { // if tall screen
            w = 0.95 * device_info.width
            h = w / ideal_canvas_aspect
        }
        
        return [h, w] 
    }

2 Totaal": [783, 150],"23 Links": [730, 400],"23 Midden": [716, 400],"23 Rechts": [735, 400],"23 Totaal": [785, 150],"24 Links": [731, 400],"24 Midden": [716, 400],"24 Rechts": [733, 400],"24 Totaal": [783, 150],"25 Links": [728, 400],"25 Midden": [715, 400],"25 Rechts": [731, 400],"25 Totaal": [784, 150],"26 Links": [727, 400],"26 Midden": [715, 400],"26 Rechts": [733, 400],"26 Totaal": [784, 150],"27 Links": [730, 400],"27 Midden": [715, 400],"27 Rechts": [731, 400],"27 Totaal": [784, 150],"28 Links": [731, 400],"28 Midden": [715, 400],"28 Rechts": [732, 400],"28 Totaal": [784, 150]}

    //load the instruction imgs (based on condition) + practice images 
    let instruction_imgs;
    if (search_condition == 'free') {
        instruction_imgs = ['25']
    } else {

    for (let event_number of [...instruction_imgs, safe_practice_event_number, danger_practice_event_number]){
       
        let event_views = {}

    const preload_imgs_with_call = {
        type: jsPsychCallFunction,
        func: function(){
            let save_start_timestamp = performance.now()
            setTimeout(async () =>{
                for (let event_number of shuffled_event_numbers ){
                    // 09 is removed (it was similar to 08)
                    let event_views = {}
                    
                    if (event_number<=13){
                        danger_event_numbers.push(event_number)
                    } else if (event_number<=24){
                        safe_event_numbers.push(event_number)
                    } 
                    
                    for (let view of ['Links', 'Midden', 'Rechts', 'Totaal']){
                        event_views[view] = await load_img_fabric (event_number  + ' ' + view)
                    }
                    bridge_events[event_number] = event_views
                    
                }

            }, 0) // final line of setTimeout, have it begin immideatly 
        },

    }



    // feedback labels
    let n_hits, n_false_alarms, n_misses, n_correct_rejections, mean_rt

    // make fabric objects of the stimuli
    let danger_button_style = "background-color:#fe9900"
    function make_trial(event_id, trial_label='main_trial') {
        
        let report_x, report_y;
        let current_view;

        let view_sequence = [];
        let report_sequence = [];
        let loc_indicators_array = [];
        

        let fabric_trial = {
            type: jsPsychCanvasButtonResponse,
            canvas_size: get_canvas_size,
            choices: ['<h2>Brug&nbsp;openen</h2>',
                      '<h2>Ingrijpen</h2>',
            ],
            button_html: function(choice, choice_index) {            
                if (choice_index == 0) {
                    return `<button id="safe-button" class="jspsych-btn-safe" >${choice}</button>`//style="width:${0.45*get_canvas_size()[1]}px; font-size:${0.01*get_canvas_size()[1]}px}"
                } else {
                    return `<button id="danger-button" class="jspsych-btn-danger" >${choice}</button>` // style="width:${0.45*get_canvas_size()[1]}px"
                };
            },
            prompt: "<p style='padding:0em;margin:0.1em'>Bekijk de camerabeelden goed!<br>Open de brug als dat veilig kan, of wijs het gevaar aan en grijp in!</p>",
            // post_response_delay: entry_exit_duration,
            // enable_button_after: pre_cue_duration,
            stimulus: function (c) {
                
                let safe_button_el = document.getElementById("safe-button")
                let danger_button_el = document.getElementById("danger-button")

                //intitially disable the buttons
                safe_button_el.setAttribute("disabled", "disabled");
                danger_button_el.setAttribute("disabled", "disabled");
                


                // initialize canvas and timestamp
                trial_start_time = performance.now()
                let canvas = new fabric.Canvas("jspsych-canvas-stimulus", {backgroundColor:fabric_canvas_bg_col, selection:false, centeredScaling:true});
                let canvas_el = document.getElementById("jspsych-canvas-stimulus");

                let canvas_rect = () => {return canvas_el.getBoundingClientRect()};

                let canvas_diag = (canvas_rect().width**2 + canvas_rect().height**2)**0.5

                // place total image at the top of canvas
                let tot_img = bridge_events[event_id]['Totaal']
                let tot_img_scale_w = canvas_rect().width / tot_img.width
                let tot_img_scale_h = (0.2*canvas_rect().height)/ tot_img.height
                let tot_img_scale = Math.min(tot_img_scale_w, tot_img_scale_h)
                
                tot_img.set({
                    top: tot_img_scale * tot_img.height/2 ,
                    left:  canvas_rect().width/2,
                })
                tot_img.scale(tot_img_scale)
                canvas.add(tot_img)   



                // place viewing image below the total image
                let view_img, view_img_scale_w, view_img_scale_h, view_img_scale
                function set_view_img(view_label) {
                    canvas.remove(view_img)

                    view_img =  bridge_events[event_id][view_label]
                    view_img_scale_w = canvas_rect().width / view_img.width
                    view_img_scale_h = (0.8*canvas_rect().height ) / view_img.height
                    view_img_scale = Math.min(view_img_scale_h, view_img_scale_w)
                    
                    view_img.set({
                        top: tot_img_scale * tot_img.height + view_img_scale * view_img.height/2 + canvas_rect().height*0.01,
                        left: canvas_rect().width/2,
                    })
                    view_img.scale(view_img_scale)
                    canvas.add(view_img)


                    // reset view indicator
                    view_indicator.width = 0.97 * tot_img.width*tot_img_scale / 3
                    if (view_label == "Links"){
                        view_indicator.left = canvas_rect().width/2 - (tot_img_scale * (tot_img.width/3) )
                    } 
                    if (view_label == "Midden"){
                        view_indicator.left = canvas_rect().width/2 
                    } 
                    if (view_label == "Rechts"){
                        view_indicator.left = canvas_rect().width/2 + (tot_img_scale * (tot_img.width/3))
                    }
                    
                    view_indicator.setCoords()
                    canvas.remove(view_indicator)
                    canvas.add(view_indicator)
                    


                    // record view change
                    view_sequence.push({
                        view:view_label,
                        time_since_trial_start: performance.now()-trial_start_time
                    })

                    // set current view
                    current_view = view_label
                }
                
                // add location indicator
                for (let i=0;i<3;i++){
                    let loc_indicator = new fabric.Circle({
                        radius: canvas_diag*0.024 , fill: 'rgba(0,0,0,0)', stroke:'rgba(255,0,0,0.65)', strokeWidth:canvas_diag*0.012,
                    });
                    loc_indicator.set({
                        left:0.1*canvas_rect().height , 
                        top: 0.1*canvas_rect().height})
                    loc_indicator.setCoords()
                    canvas.add(loc_indicator)
                    loc_indicators_array.push(loc_indicator)
                }






                // add loc indicator placeholder
                loc_indicator_placeholder = new fabric.Circle({
                    radius:loc_indicators_array[0].radius*1.6 , 
                    fill: 'rgba(0,0,0,0)', stroke: 'rgba(255,0,0,0.65)', // "#0084ff99"
                    strokeWidth:canvas_diag*0.0015, 
                });
                loc_indicator_placeholder.set({
                    left:0.1*canvas_rect().height , 
                    top: 0.1*canvas_rect().height})
                loc_indicator_placeholder.setCoords()
                canvas.add(loc_indicator_placeholder)
                
                // add reset text 
                let reset_text = new fabric.Text('RESET',  { 
                    fontSize: 0.033*canvas_rect().height ,
                    fontFamily:'Malington',
                    // fontStyle: 'bold',
                    left:0.1*canvas_rect().height , 
                    top: 0.189*canvas_rect().height,
                    fill:'rgb(255,0,0)',
                    opacity:0,
                    strokeWidth:0
                    }
                );

                canvas.add(reset_text)



                // create view indicator
                view_indicator = new fabric.Rect({
                    width: 0.99 * tot_img.width*tot_img_scale, 
                    height: 0.95 * tot_img.height*tot_img_scale, 
                    fill: 'rgba(0,0,0,0)', stroke:theme_blue_light, strokeWidth: canvas_diag*0.006,
                });
                view_indicator.set({
                    left:0.5*canvas_rect().width , 
                    top: 0.1*canvas_rect().height})
                view_indicator.setCoords()

                canvas.add(view_indicator)
                           


                // handle location reports and view changes
                
                canvas.on(
                    'mouse:down', 
                    function(options) {

                        // remove-add all loc indicators to bring them to the front.
                        for (let loc_indicator of loc_indicators_array) {
                            canvas.remove(loc_indicator)
                            canvas.add(loc_indicator)
                        }

                        // handle either touchscreen taps and mouse clicks
                        if (''+options.e == '[object MouseEvent]') { 
                                report_x = Math.round(options.e.clientX - canvas_rect().x)
                                report_y = Math.round(options.e.clientY - canvas_rect().y)
                            } else if (''+options.e == '[object TouchEvent]'){
                                let touch = options.e.touches.item(0)
                                report_x = Math.round(touch.clientX - canvas_rect().x)
                                report_y = Math.round(touch.clientY - canvas_rect().y)
                            }
                        
                        // move indicator to indicated location
                        if ((report_y > 0.2*canvas_rect().height) && current_view) {
                            let loc_indicator = loc_indicators_array.shift() // take the first loc indicator of out of array to handle it
                            // push it onto the end of the array 
                            loc_indicators_array.push(loc_indicator) // take the first loc indicator of out of array and handle it

                            //disable safe button and enable danger button
                            safe_button_el.setAttribute("disabled", "disabled");
                            danger_button_el.removeAttribute("disabled");

                            // loc_indicator.set({left:report_x, top:report_y})
                            loc_indicator.animate('left', report_x, {
                                onChange: canvas.renderAll.bind(canvas),
                                duration: 150,
                                easing: fabric.util.ease.easeOutQuad              
                            })
                            loc_indicator.animate('top', report_y, {
                                onChange: canvas.renderAll.bind(canvas),
                                duration: 150,
                                easing: fabric.util.ease.easeOutQuad              
                            })
                            
                            // compute normalized location on image itself: ie 
                            // topleft = (0,0);         topright=(1,0); 
                            //            center=(0.5,0.5)
                            // bottomleft=(0,1);       bottomright=(1,1); 
                            let vw,vh,vx,vy;
                            vw = view_img.width * view_img_scale
                            vh = view_img.height * view_img_scale
                            vx = view_img.left
                            vy = view_img.top

                            let report_x_norm = p5map(report_x, vx - vw/2, vx + vw/2, 0, 1)
                            let report_y_norm = p5map(report_y, vy - vh/2, vy + vh/2, 0, 1) 

                                  

                            console.log('report_x_norm', report_x_norm)
                            console.log('report_y_norm', report_y_norm)
                            loc_indicator.report_x_norm = report_x_norm
                            loc_indicator.report_y_norm = report_y_norm

                            // record location indication sequence
                            report_sequence.push({
                                report_loc: [report_x,report_y],
                                report_loc_norm: [report_x_norm, report_y_norm],
                                view: current_view,
                                event_id: event_id,
                                time_since_trial_start: performance.now() - trial_start_time,
                                label: 'location reported'
                            })

                            // show reset text
                            reset_text.opacity = 1 


                        }  
                        
                        // (re)set image to view
                        let tot_img_edge_0 = canvas_rect().width/2 - (tot_img_scale * tot_img.width / 2)
                        let tot_img_edge_1 = canvas_rect().width/2 - (tot_img_scale * tot_img.width / 3 / 2)
                        let tot_img_edge_2 = canvas_rect().width/2 + (tot_img_scale * tot_img.width / 3 / 2)
                        let tot_img_edge_3 = canvas_rect().width/2 + (tot_img_scale * tot_img.width / 2)

                        if (report_y <= 0.2*canvas_rect().height) { // if in the indicator zone

                            if ( (report_x > tot_img_edge_0) && (report_x <= tot_img_edge_1) ) {  // indicate Left
                                if( current_view != "Links") {set_view_img("Links")}                                
                            }

                            if ( (report_x > tot_img_edge_1) && (report_x <= tot_img_edge_2) ) {  // indicate Middle
                                if( current_view != "Midden") {set_view_img("Midden")}
                            } 
                            
                            if ( (report_x > tot_img_edge_2) && (report_x <= tot_img_edge_3) ) { // indicate Right
                                if( current_view != "Rechts") {set_view_img("Rechts")}
                            }

                            if ( (report_x < tot_img_edge_0) || (report_x > tot_img_edge_3) ) { // Pure reset of indicators
                                report_sequence.push({
                                    view: current_view,
                                    event_id: event_id,
                                    time_since_trial_start: performance.now() - trial_start_time,
                                    label: 'reset indicators'
                                })
                                console.log(report_sequence)
                            }

                            // reset all loc indicators to original position
                            for (let loc_indicator of loc_indicators_array) {

    // make fabric objects of the stimuli
    function make_instruction_trial(event_id) {
        
        let report_x, report_y;
        let current_view;

        let view_sequence = [];
        let report_sequence = [];
        let loc_indicators_array = [];
        

        let fabric_trial = {
            type: jsPsychCanvasButtonResponse,
            canvas_size: get_canvas_size,
            choices: ['<h2>Verder</h2>'],
            prompt: "<p style='padding:0em;margin:0.1em'>Open elk camerabeeld en plaats een vinkje in elk gekleurd gebied, om verder te gaan</p>",
            button_html: function(choice, choice_index) {   
                return `<button id="continue-button" class="jspsych-btn" >${choice}</button>`
            },

            stimulus: function (c) {
                let reported_area_flags = [0, 0, 0, 0, 0, 0]
                let continue_button_el = document.getElementById("continue-button")

                //intitially disable the continue button
                continue_button_el.setAttribute("disabled", "disabled");
                
                
                // initialize canvas and timestamp
                trial_start_time = performance.now()
                let canvas = new fabric.Canvas("jspsych-canvas-stimulus", {backgroundColor:fabric_canvas_bg_col, selection:false, centeredScaling:true});
                let canvas_el = document.getElementById("jspsych-canvas-stimulus");

                let canvas_rect = () => {return canvas_el.getBoundingClientRect()};

                let canvas_diag = (canvas_rect().width**2 + canvas_rect().height**2)**0.5

                // place total image at the top of canvas
                let tot_img = bridge_events[event_id]['Totaal']
                let tot_img_scale_w = canvas_rect().width / tot_img.width
                let tot_img_scale_h = (0.2*canvas_rect().height)/ tot_img.height
                let tot_img_scale = Math.min(tot_img_scale_w, tot_img_scale_h)
                
                tot_img.set({
                    top: tot_img_scale * tot_img.height/2 ,
                    left:  canvas_rect().width/2,
                })
                tot_img.scale(tot_img_scale)
                canvas.add(tot_img)   



                // place viewing image below the total image
                let view_img, view_img_scale_w, view_img_scale_h, view_img_scale
                function set_view_img(view_label) {
                    canvas.remove(view_img)

                    view_img =  bridge_events[event_id][view_label]
                    view_img_scale_w = canvas_rect().width / view_img.width
                    view_img_scale_h = (0.8*canvas_rect().height ) / view_img.height
                    view_img_scale = Math.min(view_img_scale_h, view_img_scale_w)
                    
                    view_img.set({
                        top: tot_img_scale * tot_img.height + view_img_scale * view_img.height/2 + canvas_rect().height*0.01,
                        left: canvas_rect().width/2,
                    })
                    view_img.scale(view_img_scale)
                    canvas.add(view_img)


                    // reset view indicator
                    view_indicator.width = 0.97 * tot_img.width*tot_img_scale / 3
                    if (view_label == "Links"){
                        view_indicator.left = canvas_rect().width/2 - (tot_img_scale * (tot_img.width/3) )
                    } 
                    if (view_label == "Midden"){
                        view_indicator.left = canvas_rect().width/2 
                    } 
                    if (view_label == "Rechts"){
                        view_indicator.left = canvas_rect().width/2 + (tot_img_scale * (tot_img.width/3))
                    }
                    
                    view_indicator.setCoords()
                    canvas.remove(view_indicator)
                    canvas.add(view_indicator)
                    


                    // record view change
                    view_sequence.push({
                        view:view_label,
                        time_since_trial_start: performance.now()-trial_start_time
                    })

                    // set current view
                    current_view = view_label
                }

                // add loc indicator placeholder
                loc_indicator_placeholder = new fabric.Circle({
                    radius: canvas_diag*0.0384, 
                    fill: 'rgba(200,200,200,1)', stroke: 'rgba(30,180,30,1)', // "#0084ff99"
                    strokeWidth:canvas_diag*0.005, 
                });
                loc_indicator_placeholder.set({
                    left:0.1*canvas_rect().height, 
                    top: 0.1*canvas_rect().height})
                loc_indicator_placeholder.setCoords()
                canvas.add(loc_indicator_placeholder)
                
                
                let n_checkmarks = (event_id == '28') ? 2 : 1 // have 2 checkmarks on yellow, else have 1 for red, blue, and green 

                // add location indicator
                for (let i=0;i<n_checkmarks;i++){
                    // let loc_indicator = new fabric.Circle({
                    //     radius: canvas_diag*0.024 , fill: 'rgba(0,0,0,0)', stroke:'rgba(255,0,0,0.65)', strokeWidth:canvas_diag*0.012,
                    // });
                    let s = canvas_diag*0.024 *2
                    let loc_indicator = new fabric.Polyline([
                            { x: s*0.05, y: s*0.35 },
                            { x: s*0.4, y: s*0.7  },
                            { x: s*0.99, y: s*0.1  },
                        ],{
                        width: s,
                        height: s,
                        stroke:'rgba(0,0,0,1)', strokeWidth:canvas_diag*0.012,
                        fill:'rgba(0,0,0,0)'
                    });



                    loc_indicator.set({
                        left:0.1*canvas_rect().height , 
                        top: 0.1*canvas_rect().height})
                    loc_indicator.setCoords()
                    canvas.add(loc_indicator)
                    loc_indicators_array.push(loc_indicator)
                }


                


                // create view indicator
                view_indicator = new fabric.Rect({
                    width: 0.99 * tot_img.width*tot_img_scale, 
                    height: 0.95 * tot_img.height*tot_img_scale, 
                    fill: 'rgba(0,0,0,0)', stroke:theme_blue_light, strokeWidth: canvas_diag*0.006,
                });
                view_indicator.set({
                    left:0.5*canvas_rect().width , 
                    top: 0.1*canvas_rect().height})
                view_indicator.setCoords()

                canvas.add(view_indicator)
                           


                // handle location reports and view changes
                
                canvas.on(
                    'mouse:down', 
                    function(options) {

                        // remove-add all loc indicators to bring them to the front.
                        for (let loc_indicator of loc_indicators_array) {
                            canvas.remove(loc_indicator)
                            canvas.add(loc_indicator)
                        }

                        // handle either touchscreen taps and mouse clicks
                        if (''+options.e == '[object MouseEvent]') { 
                                report_x = Math.round(options.e.clientX - canvas_rect().x)
                                report_y = Math.round(options.e.clientY - canvas_rect().y)
                            } else if (''+options.e == '[object TouchEvent]'){
                                let touch = options.e.touches.item(0)
                                report_x = Math.round(touch.clientX - canvas_rect().x)
                                report_y = Math.round(touch.clientY - canvas_rect().y)
                            }
                        
                        // move indicator to indicated location
                        if ((report_y > 0.2*canvas_rect().height) && current_view) {
                            let loc_indicator = loc_indicators_array.shift() // take the first loc indicator of out of array to handle it
                            // push it onto the end of the array 
                            loc_indicators_array.push(loc_indicator) // take the first loc indicator of out of array and handle it


                            // loc_indicator.set({left:report_x, top:report_y})
                            loc_indicator.animate('left', report_x, {
                                onChange: canvas.renderAll.bind(canvas),
                                duration: 150,
                                easing: fabric.util.ease.easeOutQuad              
                            })
                            loc_indicator.animate('top', report_y, {
                                onChange: canvas.renderAll.bind(canvas),
                                duration: 150,
                                easing: fabric.util.ease.easeOutQuad              
                            })
                            
                            // compute normalized location on image itself: ie 
                            // topleft = (0,0);         topright=(1,0); 
                            //            center=(0.5,0.5)
                            // bottomleft=(0,1);       bottomright=(1,1); 
                            let vw,vh,vx,vy;
                            vw = view_img.width * view_img_scale
                            vh = view_img.height * view_img_scale
                            vx = view_img.left
                            vy = view_img.top

                            let report_x_norm = p5map(report_x, vx - vw/2, vx + vw/2, 0, 1)
                            let report_y_norm = p5map(report_y, vy - vh/2, vy + vh/2, 0, 1) 

                                  

                            console.log('report_x_norm', report_x_norm)
                            console.log('report_y_norm', report_y_norm)
                            loc_indicator.report_x_norm = report_x_norm
                            loc_indicator.report_y_norm = report_y_norm

                            // record location indication sequence
                            report_sequence.push({
                                report_loc: [report_x,report_y],
                                report_loc_norm: [report_x_norm, report_y_norm],
                                view: current_view,
                                event_id: event_id,
                                time_since_trial_start: performance.now() - trial_start_time,
                                label: 'location reported'
                            })

                            // Check if all areas are indicated and enable continue button                        
                            for (let rep of report_sequence) {

                                if (event_id == '28') { // check if clicked twice on each view with yellow areas
                                    if ((rep.view == "Links") && reported_area_flags[0] == 1 ) {reported_area_flags[3] = 1                                    
                                    } else if (rep.view == "Links") {reported_area_flags[0] = 1 }

                                    
                                    if ((rep.view == "Midden") && reported_area_flags[1] == 1 ) {reported_area_flags[4] = 1                                    
                                    } else if (rep.view == "Midden") {reported_area_flags[1] = 1}

                                    if ((rep.view == "Rechts") && reported_area_flags[2] == 1 ) {reported_area_flags[5] = 1
                                    } else if (rep.view == "Rechts") {reported_area_flags[2] = 1} 


                                } else {// check if clicked once on each view                                
                                    if (rep.view == "Links") {reported_area_flags[0] = 1}
                                    if (rep.view == "Midden") {reported_area_flags[1] = 1}
                                    if (rep.view == "Rechts") {reported_area_flags[2] = 1}         
                                }
                            }

                            // if enough areas checked enable the continue button 
                            let required_reports = (event_id == '28') ? 6 : 3
                            if (sum(reported_area_flags) == required_reports){
                                continue_button_el.removeAttribute("disabled")
                            }

                        }  
                        
                        // (re)set image to view
                        let tot_img_edge_0 = canvas_rect().width/2 - (tot_img_scale * tot_img.width / 2)
                        let tot_img_edge_1 = canvas_rect().width/2 - (tot_img_scale * tot_img.width / 3 / 2)
                        let tot_img_edge_2 = canvas_rect().width/2 + (tot_img_scale * tot_img.width / 3 / 2)
                        let tot_img_edge_3 = canvas_rect().width/2 + (tot_img_scale * tot_img.width / 2)

                        if (report_y <= 0.2*canvas_rect().height) { // if in the indicator zone

                            if ( (report_x > tot_img_edge_0) && (report_x <= tot_img_edge_1) ) {  // indicate Left
                                if( current_view != "Links") {set_view_img("Links")}                                
                            }

                            if ( (report_x > tot_img_edge_1) && (report_x <= tot_img_edge_2) ) {  // indicate Middle
                                if( current_view != "Midden") {set_view_img("Midden")}
                            } 
                            
                            if ( (report_x > tot_img_edge_2) && (report_x <= tot_img_edge_3) ) { // indicate Right
                                if( current_view != "Rechts") {set_view_img("Rechts")}
                            }
                

                            // reset all loc indicators to original position
                            for (let loc_indicator of loc_indicators_array) {
                                
                                loc_indicator.animate('left', 0.1*canvas_rect().height, {
                                    onChange: canvas.renderAll.bind(canvas),
                                    duration: 150,
                                    easing: fabric.util.ease.easeOutQuad              
                                })
                                loc_indicator.animate('top', 0.1*canvas_rect().height, {
                                    onChange: canvas.renderAll.bind(canvas),
                                    duration: 150,
                                    easing: fabric.util.ease.easeOutQuad              
                                }) 
                                canvas.remove(loc_indicator)
                                canvas.add(loc_indicator)   
                            }
                        }
                    }
                )
                   
                canvas.renderAll()

            },

            on_finish: function (data){
                data.label = 'instruction_trial'
                data.report_x = report_x
                data.report_y = report_y
                data.view_sequence = view_sequence
                data.report_sequence = report_sequence

                data.end_state_indicators = []
                for (let loc_indicator of loc_indicators_array){
                    data.end_state_indicators.push({
                        view: current_view,
                        report_x_norm: loc_indicator.report_x_norm,
                        report_y_norm: loc_indicator.report_y_norm,
                    })
                }

                
            }
        
        }
        return fabric_trial

    }

    function get_rand_int(min, max) { 
        // get radom integer value between min max, both inclusive
        min = Math.ceil(min);
        max = Math.floor(max);
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    function get_rand_from_array(array) {
        let i = get_rand_int(0, array.length - 1)
        return array[i]
    }
    
    function get_rand_float(min, max) {
        return Math.random() * (max - min) + min;

    }
    
    function clamp(val, min, max) {
        if (min > max ) {throw new Error("Min value is larger than max value.")}
        return Math.min( max,  Math.max( val, min) )
    }

    function p5map(n, start1, stop1, start2, stop2) {
        return ((n-start1)/(stop1-start1))*(stop2-start2)+start2;
    };

        return array.reduce((x, y) => x + y,  0);
